<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiropodia LC - Reserva de Citas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="booking-container">
    <header class="clinic-header">
      <h1 class="clinic-title">Quiropodia LC</h1>
      <p class="clinic-subtitle">Cuidado profesional para sus pies</p>
    </header>

    <main class="booking-card">
      <h2>Agende su Cita</h2>
      <form id="booking-form" novalidate>
        
        <div class="form-group">
          <label for="booking-date">Fecha de la Cita</label>
          <input type="date" id="booking-date" required>
        </div>

        <div class="form-group">
          <label>Horarios Disponibles</label>
          <div id="slots-container" class="slots-grid">
            <p class="placeholder-text">Por favor, seleccione una fecha para ver los horarios disponibles.</p>
          </div>
          <!-- Hidden input to store selected slot time -->
          <input type="hidden" id="selected-time" required>
        </div>

        <div class="form-group">
          <label for="booking-name">Nombre Completo</label>
          <input type="text" id="booking-name" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="form-group">
          <label for="booking-phone">Número de Teléfono</label>
          <input type="tel" id="booking-phone" placeholder="Ej. 123456789" required>
        </div>

        <button type="submit" id="confirm-booking" class="btn btn-primary" disabled>Confirmar Reserva</button>
      </form>

      <div id="feedback-message" class="feedback-area hidden"></div>
    </main>
  </div>

  <script src="client.js"></script>
</body>
</html>
